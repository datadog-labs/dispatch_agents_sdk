# .github/workflows/release.yml
name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      skip_tag_and_release:
        description: Skip creating the git tag and GitHub Release (use when they already exist) and just run CI + publish for the selected ref/tag.
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version_policy:
    uses: ./.github/workflows/version-policy-reusable.yml

  ci:
    name: CI
    needs: version_policy
    uses: ./.github/workflows/ci-reusable.yml
    with:
      upload_dist_artifact: true

  release:
    name: Tag & Release
    needs: [version_policy, ci]
    if: needs.version_policy.outputs.should_release == 'true' || (github.event_name == 'workflow_dispatch' && inputs.skip_tag_and_release)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0   # full history so we can read all tags

      - name: Download dist artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: dist
          path: dist/

      - name: Get dd-octo-sts token
        if: ${{ !inputs.skip_tag_and_release }}
        id: octo-sts
        uses: DataDog/dd-octo-sts-action@96a25462dbcb10ebf0bfd6e2ccc917d2ab235b9a # v1.0.4
        with:
          scope: datadog-labs/dispatch_agents_sdk
          policy: self.release.push

      - name: Verify dd-octo-sts token
        if: ${{ !inputs.skip_tag_and_release }}
        run: gh auth status
        env:
          GH_TOKEN: ${{ steps.octo-sts.outputs.token }}

      - name: Create git tag
        if: ${{ !inputs.skip_tag_and_release }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ needs.version_policy.outputs.current_tag }}"
          git remote set-url origin "https://x-access-token:${{ steps.octo-sts.outputs.token }}@github.com/${{ github.repository }}.git"
          git push origin "${{ needs.version_policy.outputs.current_tag }}"

      - name: Create GitHub Release
        if: ${{ !inputs.skip_tag_and_release }}
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe
        with:
          tag_name: "${{ needs.version_policy.outputs.current_tag }}"
          name: "${{ needs.version_policy.outputs.current_tag }}"
          generate_release_notes: true
          files: dist/*

  publish:
    name: Publish
    needs: [version_policy, ci, release]
    if: needs.version_policy.outputs.should_release == 'true' || (github.event_name == 'workflow_dispatch' && inputs.skip_tag_and_release)
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: dist
          path: dist/

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86

      - name: Publish to PyPI
        run: uv publish --trusted-publishing always dist/*
